<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#105800" />
  <meta name="description" content="Lemoo helps farmers estimate cattle weight and make informed feeding decisions with LiDAR-based measurements and practical feed planning." />
  <title>Lemoo — Cattle weight, made clearer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{--green:#105800;--green-dark:#0b3c00;--green-soft:#edf4e9;--tan:#B2854A;--ink:#192317;--muted:#64705f;--line:#e8ebe3;--paper:#fff;--wash:#f8f9f5}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}.shell{max-width:1120px;margin:auto;padding:0 32px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.wordmark{display:flex;align-items:center;gap:10px;font:800 19px Manrope,sans-serif;letter-spacing:-.7px;color:var(--green)}.wordmark svg{width:29px}.nav{display:flex;align-items:center;gap:34px;font-size:13px;color:#53604f}.nav a{text-decoration:none}.nav a:hover{color:var(--green)}.nav-cta{border:1px solid #d6dfd0;border-radius:999px;padding:10px 17px;color:var(--green)!important;font-weight:700}.hero{padding:82px 0 68px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-126px;top:14px;width:450px;height:450px;border-radius:50%;background:radial-gradient(circle,#edf4e8 0%,#f8faf5 58%,transparent 70%);z-index:-1}.eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--green);font-size:11px;text-transform:uppercase;letter-spacing:1.55px;font-weight:700}.eyebrow:before{content:"";width:22px;height:1px;background:var(--tan)}.hero-brand{display:flex;align-items:center;gap:25px;margin:24px 0 22px}.app-icon{width:100px;height:100px;border-radius:26px;background:var(--green);display:grid;place-items:center;box-shadow:0 15px 32px #10580024;flex:none}.app-icon svg{width:64px;height:64px}.hero h1{font:800 clamp(50px,7vw,78px)/.98 Manrope,sans-serif;letter-spacing:-5px;margin:0;color:var(--green-dark)}.hero-copy{font:500 clamp(18px,2.1vw,23px)/1.55 Manrope,sans-serif;max-width:690px;letter-spacing:-.45px;margin:0;color:#33402f}.hero-sub{font-size:15px;line-height:1.75;max-width:650px;color:var(--muted);margin:14px 0 28px}.hero-actions{display:flex;align-items:center;gap:22px}.button{display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;border-radius:999px;padding:14px 21px;background:var(--green);color:white;font-size:13px;font-weight:700;box-shadow:0 8px 18px #10580020}.text-link{font-size:13px;color:var(--green);font-weight:700;text-decoration:none}.hero-note{font-size:11px;color:#788173;margin-top:20px}.stats{display:flex;gap:36px;border-top:1px solid var(--line);padding-top:22px;margin-top:42px;max-width:690px}.stat strong{display:block;font:700 18px Manrope;color:var(--green)}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.section{padding:76px 0}.section-kicker{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tan);font-weight:700}.section-heading{font:700 clamp(30px,4vw,43px)/1.12 Manrope,sans-serif;letter-spacing:-1.8px;margin:13px 0 12px;color:var(--green-dark)}.section-intro{font-size:14px;line-height:1.75;color:var(--muted);max-width:560px;margin:0}.features{background:var(--wash);border-top:1px solid #f0f1eb;border-bottom:1px solid #f0f1eb}.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:35px}.feature-card{background:white;border:1px solid var(--line);border-radius:18px;padding:28px 28px 26px;min-height:240px}.feature-icon{width:42px;height:42px;border-radius:13px;background:var(--green-soft);display:grid;place-items:center;color:var(--green);margin-bottom:24px}.feature-icon svg{width:21px;height:21px}.feature-card h3{font:700 18px Manrope;margin:0 0 10px;letter-spacing:-.45px}.feature-card p{font-size:13px;line-height:1.8;color:var(--muted);margin:0}.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.7px;color:var(--green);background:var(--green-soft);padding:7px 10px;border-radius:999px;margin-top:19px}.team{padding-bottom:84px}.team-head{display:flex;align-items:end;justify-content:space-between;gap:24px}.team-count{color:var(--muted);font-size:12px;padding-bottom:6px}.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:33px}.person{display:flex;align-items:center;gap:14px;padding:17px;border:1px solid var(--line);border-radius:14px;background:#fff}.avatar{width:42px;height:42px;border-radius:50%;background:#eff3e9;color:var(--green);display:grid;place-items:center;font:700 13px Manrope;flex:none}.person:nth-child(3n+2) .avatar{background:#f6f0e7;color:#886536}.person:nth-child(3n) .avatar{background:#eaf1ed}.person-name{font:700 13px Manrope}.person-role{font-size:11px;color:var(--muted);margin-top:4px}.support{background:var(--green-dark);color:white;padding:67px 0}.support-inner{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}.support .section-kicker{color:#d1b07c}.support .section-heading{color:#fff}.support .section-intro{color:#cfdbc9}.support-links{display:grid;gap:12px}.contact{display:flex;align-items:center;gap:14px;padding:16px 17px;border:1px solid #ffffff26;border-radius:13px;text-decoration:none;background:#ffffff08}.contact-icon{width:37px;height:37px;border-radius:11px;background:#ffffff16;display:grid;place-items:center;color:#e5c99d}.contact-icon svg{width:18px}.contact-label{font-size:10px;color:#b7c9b0;letter-spacing:.7px;text-transform:uppercase}.contact-value{font-size:13px;font-weight:600;margin-top:4px}.contact-arrow{margin-left:auto;color:#d5bd99;font-size:18px}.footer{padding:22px 0;color:#899184;font-size:11px}.footer-inner{display:flex;align-items:center;justify-content:space-between}.footer-brand{display:flex;align-items:center;gap:8px;color:var(--green);font:800 14px Manrope}.footer-brand svg{width:21px}
    @media(max-width:700px){.shell{padding:0 22px}.topbar{height:65px}.nav{gap:18px}.nav a:not(.nav-cta){display:none}.hero{padding:57px 0 52px}.hero-brand{flex-direction:column;align-items:flex-start;gap:19px;margin-top:23px}.app-icon{width:84px;height:84px;border-radius:23px}.app-icon svg{width:54px}.hero h1{font-size:63px;letter-spacing:-4px}.hero-copy{font-size:19px}.hero:after{right:-250px;top:90px}.stats{gap:23px}.section{padding:59px 0}.feature-grid{grid-template-columns:1fr}.feature-card{min-height:0}.team-head{align-items:flex-start;flex-direction:column;gap:0}.team-grid{grid-template-columns:1fr 1fr}.person{padding:13px 11px;gap:10px}.avatar{width:36px;height:36px;font-size:11px}.person-name{font-size:12px}.person-role{font-size:10px}.support{padding:56px 0}.support-inner{grid-template-columns:1fr;gap:28px}.footer-inner{align-items:flex-start;gap:12px;flex-direction:column}}
    @media(max-width:390px){.team-grid{grid-template-columns:1fr}.hero h1{font-size:57px}.stats{gap:16px}.stat strong{font-size:16px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { createElement: h } = React;
function BrandMark({light=false}){return <svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M15 34c0-10 7-18 17-18 8 0 14 5 17 13 3 8-1 17-8 21-6 3-14 2-19-3" stroke={light?'#fff':'#fff'} strokeWidth="4" strokeLinecap="round"/><path d="M13 39c9 1 17-2 23-8 4-4 7-9 8-14" stroke="#D9B477" strokeWidth="4" strokeLinecap="round"/><path d="M16 47c4 2 8 3 12 3" stroke="#fff" strokeWidth="4" strokeLinecap="round"/><circle cx="45" cy="17" r="3" fill="#D9B477"/></svg>}
function Icon({type}){const props={viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:'1.7',strokeLinecap:'round',strokeLinejoin:'round', 'aria-hidden':true};if(type==='measure')return <svg {...props}><path d="M3 7h18v10H3z"/><path d="M7 7v4m4-4v2m4-2v4m4-4v2M6 17v-3m12 3v-3"/><path d="M3 12h18"/></svg>;if(type==='feed')return <svg {...props}><path d="M12 21c4.5-2.7 7-6.3 7-10.5A7 7 0 0 0 5 10.5C5 14.7 7.5 18.3 12 21Z"/><path d="M12 20V9m0 5c-2.5 0-4-1.2-4.5-3m4.5 5c2.5 0 4-1.2 4.5-3"/></svg>;if(type==='mail')return <svg {...props}><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>;return <svg {...props}><path d="M7 3h3l2 5-2 1.5a14 14 0 0 0 4.5 4.5L16 12l5 2v3a2 2 0 0 1-2 2C10 19 5 14 5 5a2 2 0 0 1 2-2Z"/></svg>}
const developers=['Alex Morgan','Jamie Chen','Taylor Brooks','Riley Patel','Jordan Kim','Casey Rivera'];
function App(){return <><header className="shell topbar"><a className="wordmark" href="#home" aria-label="Lemoo home"><BrandMark/>Lemoo</a><nav className="nav" aria-label="Main navigation"><a href="#features">How it works</a><a href="#team">Our team</a><a className="nav-cta" href="#support">Contact support</a></nav></header><main id="home"><section className="shell hero"><div className="eyebrow">A clearer view of cattle care</div><div className="hero-brand"><div className="app-icon"><BrandMark/></div><h1>Lemoo</h1></div><p className="hero-copy">Know your cattle better. Make every feeding decision count.</p><p className="hero-sub">Lemoo helps farmers estimate cattle weight with LiDAR-based measurements, then plan nutrition around each animal’s needs and growth targets.</p><div className="hero-actions"><a className="button" href="#features">Explore what Lemoo does <span aria-hidden="true">→</span></a><a className="text-link" href="#support">Talk to our team</a></div><div className="hero-note">Practical insights for more confident day-to-day care.</div><div className="stats"><div className="stat"><strong>LiDAR-powered</strong><span>Body measurement estimates</span></div><div className="stat"><strong>Nutrition-aware</strong><span>Feed mix evaluation</span></div><div className="stat"><strong>Growth-focused</strong><span>Plans around your targets</span></div></div></section><section className="features section" id="features"><div className="shell"><div className="section-kicker">Made for the daily decisions</div><h2 className="section-heading">From measurement to a smarter plan.</h2><p className="section-intro">Useful information, brought together to help you care for your cattle with greater confidence.</p><div className="feature-grid"><article className="feature-card"><div className="feature-icon"><Icon type="measure"/></div><h3>Cattle weight estimation</h3><p>Measure your cattle’s body dimensions using LiDAR on supported devices. Get an estimated live weight to support daily care and cattle fattening plans.</p><span className="tag">ESTIMATE WITH LI DAR</span></article><article className="feature-card"><div className="feature-icon"><Icon type="feed"/></div><h3>Feed planning</h3><p>Evaluate your feed mix against reference nutritional requirements based on estimated weight and target daily gain. Spot potential nutrient shortfalls and use those insights to adjust your feeding plan.</p><span className="tag">PLAN AROUND GROWTH</span></article></div></div></section><section className="shell section team" id="team"><div className="team-head"><div><div className="section-kicker">The people behind Lemoo</div><h2 className="section-heading">Built with care.</h2><p className="section-intro">A team focused on making cattle care decisions clearer and more practical.</p></div><div className="team-count">6 developers · one shared goal</div></div><div className="team-grid">{developers.map(name=><div className="person" key={name}><div className="avatar" aria-hidden="true">{name.split(' ').map(n=>n[0]).join('')}</div><div><div className="person-name">{name}</div><div className="person-role">Developer</div></div></div>)}</div></section><section className="support" id="support"><div className="shell support-inner"><div><div className="section-kicker">We’re here to help</div><h2 className="section-heading">Need a hand?</h2><p className="section-intro">Questions about using Lemoo or need support? Reach out and our team will be happy to help.</p></div><div className="support-links"><a className="contact" href="mailto:support@lemoo.app"><span className="contact-icon"><Icon type="mail"/></span><span><span className="contact-label">Email support</span><span className="contact-value">support@lemoo.app</span></span><span className="contact-arrow" aria-hidden="true">↗</span></a><a className="contact" href="tel:+15550142026"><span className="contact-icon"><Icon type="phone"/></span><span><span className="contact-label">Call us</span><span className="contact-value">+1 (555) 014-2026</span></span><span className="contact-arrow" aria-hidden="true">↗</span></a></div></div></section></main><footer className="shell footer"><div className="footer-inner"><div className="footer-brand"><BrandMark/>Lemoo</div><div>Made for better-informed cattle care.</div><div>© {new Date().getFullYear()} Lemoo</div></div></footer></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
